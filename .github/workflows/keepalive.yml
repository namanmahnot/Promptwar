name: Keep backend awake

# Render's free tier sleeps after 15 idle minutes and a cold start takes 30-60 s.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://insightpilot-promptwar-ht1s.onrender.com/healthz
