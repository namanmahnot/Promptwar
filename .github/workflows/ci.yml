name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No API keys or connection strings in the repo
        run: |
          if git grep -nE "AIza[0-9A-Za-z_-]{20,}|BEGIN PRIVATE KEY|mongodb\+srv://[^<\s]+:[^<\s]+@" -- . ':!*.md' ':!web/.env.production' ':!.github'; then
            echo "Possible secret committed"; exit 1
          fi

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests eval
      - run: mypy app
      - run: pytest  # enforces >= 90% coverage
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test  # enforces coverage thresholds
      - run: npm run build
